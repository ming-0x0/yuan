name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: http://dev.yuan.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/package/standalone/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yuan:dev
            ${{ secrets.DOCKER_USERNAME }}/yuan:dev-${{ github.sha }}
          target: production
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yuan:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/yuan:buildcache,mode=max

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "deployments/compose/docker-compose.dev.yaml,deployments/compose/.env.dev"
          target: "/opt/yuan/"
          strip_components: 2

      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            cd /opt/yuan

            # Pull latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/yuan:dev

            # Stop and remove old containers
            docker compose -f docker-compose.dev.yaml --env-file .env.dev down

            # Start new containers with updated image
            docker compose -f docker-compose.dev.yaml --env-file .env.dev up -d

            # Wait for health check
            sleep 10

            # Verify deployment
            docker compose -f docker-compose.dev.yaml ps

            # Show recent logs
            docker compose -f docker-compose.dev.yaml logs --tail=50 app

      - name: Run health check
        run: |
          max_attempts=30
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://${{ secrets.DEV_SERVER_HOST }}:8081/health; then
              echo "Health check passed!"
              exit 0
            fi

            echo "Health check failed, retrying... ($attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "Health check failed after $max_attempts attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to Dev: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build binaries
        run: |
          # Build for multiple platforms
          GOOS=linux GOARCH=amd64 go build -o yuan-linux-amd64 cmd/standalone/main.go
          GOOS=linux GOARCH=arm64 go build -o yuan-linux-arm64 cmd/standalone/main.go
          GOOS=darwin GOARCH=amd64 go build -o yuan-darwin-amd64 cmd/standalone/main.go
          GOOS=darwin GOARCH=arm64 go build -o yuan-darwin-arm64 cmd/standalone/main.go
          GOOS=windows GOARCH=amd64 go build -o yuan-windows-amd64.exe cmd/standalone/main.go

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bugfix"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs"]
                },
                {
                  "title": "## 🔧 Other Changes",
                  "labels": []
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            yuan-linux-amd64
            yuan-linux-arm64
            yuan-darwin-amd64
            yuan-darwin-arm64
            yuan-windows-amd64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/package/standalone/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yuan:latest
            ${{ secrets.DOCKER_USERNAME }}/yuan:${{ github.ref_name }}
          target: production

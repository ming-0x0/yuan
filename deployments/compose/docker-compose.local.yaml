services:
  mysql:
    image: mysql:9
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yuan
      MYSQL_USER: yuan
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ../../build/package/local/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yuan-local-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  yuan-local-network:
    driver: bridge

volumes:
  mysql_local_data:

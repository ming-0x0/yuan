services:
  mysql:
    image: mysql:9
    container_name: mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yuan}
      MYSQL_USER: ${MYSQL_USER:-yuan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ../../build/package/local/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yuan-local-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  yuan-local-network:
    driver: bridge

volumes:
  mysql_local_data:

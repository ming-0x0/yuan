version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: yuan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yuan
      MYSQL_USER: yuan
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../build/package/local/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yuan-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: build/package/standalone/Dockerfile
    container_name: yuan-app
    environment:
      - ENV=local
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=yuan
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=yuan
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yuan-network
    volumes:
      - ../../configs:/app/configs
    command: ["/app/standalone"]

networks:
  yuan-network:
    driver: bridge

volumes:
  mysql_data:
